{%load static%}
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
</head>
<body style="padding-top: 70px;">
{%if messages%}
    {%for message in messages%}
        <div class="mt-3 alert alert-{{ message.tags }}" role="alert">
           <p>{{message}}</p>
        </div>
    {%endfor%}
{%endif%}
<nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top mb-3">
  <div class="container-fluid">
    <a class="navbar-brand" href="{%url 'landing'%}">Home</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
        </li>
      </ul>
        <a style="text-decoration:none; color:black;" href= "{%url 'products:product_list'%}">
          EXIT <i class="bi bi-box-arrow-right"></i>
        </a>
    </div>
  </div>
</nav>
{%block content%}
{%endblock%}

</body>
